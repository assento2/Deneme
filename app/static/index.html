<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoSafe AI - Küresel Ajan Komuta Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Space Grotesk', sans-serif; }
        .agent-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; cursor: pointer; }
        .agent-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body class="p-6 lg:p-12">
    <nav class="max-w-[1600px] mx-auto flex justify-between items-center mb-12">
        <div class="flex items-center space-x-4">
            <div class="bg-blue-600 p-3 rounded-2xl"><i class="fas fa-brain text-2xl text-white"></i></div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">CryptoSafe AI</h1>
                <p class="text-[10px] text-blue-400 font-mono uppercase tracking-widest">Otonom Ajan Ağı v2.0</p>
            </div>
        </div>
        <div class="flex items-center space-x-4 bg-slate-900/50 px-4 py-2 rounded-full border border-slate-800">
            <span class="w-2 h-2 bg-emerald-500 rounded-full status-pulse"></span>
            <span class="text-xs font-bold text-slate-300">SİSTEM AKTİF</span>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
        <div class="lg:col-span-3 space-y-8">
            <div id="agentsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>

            <div class="bg-slate-900/40 rounded-3xl border border-slate-800 p-8">
                <h3 class="text-xl font-bold mb-6 flex items-center">
                    <i class="fas fa-list-ul text-blue-500 mr-3"></i> Canlı İşlem Günlüğü
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="text-slate-500 text-[10px] uppercase font-bold border-b border-slate-800">
                            <tr>
                                <th class="pb-4">Ajan</th>
                                <th class="pb-4">Parite</th>
                                <th class="pb-4">Yön</th>
                                <th class="pb-4">Kâr/Zarar</th>
                                <th class="pb-4 text-right">Bakiye</th>
                            </tr>
                        </thead>
                        <tbody id="tradeLogs" class="text-sm divide-y divide-slate-800/50"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="space-y-8">
            <div class="bg-gradient-to-br from-blue-600/20 to-indigo-600/10 rounded-3xl border border-blue-500/20 p-8">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Ağ Özeti</h3>
                <div class="space-y-4">
                    <div class="bg-slate-950/40 p-4 rounded-2xl">
                        <p class="text-[10px] text-slate-500 uppercase mb-1">Toplam Sermaye</p>
                        <p id="totalCapital" class="text-2xl font-bold">$0.00</p>
                    </div>
                    <div class="bg-slate-950/40 p-4 rounded-2xl">
                        <p class="text-[10px] text-slate-500 uppercase mb-1">Aktif Ajanlar</p>
                        <p id="activeCount" class="text-2xl font-bold">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/40 rounded-3xl border border-slate-800 p-8">
                <h3 class="text-lg font-bold mb-6 flex items-center">
                    <i class="fas fa-shield-alt text-emerald-500 mr-3"></i> Güvenlik Filtresi
                </h3>
                <form id="predictForm" class="space-y-4">
                    <input type="number" step="any" name="val" value="1.0" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-blue-500">
                    <button class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold text-sm transition">İşlemi Doğrula</button>
                </form>
                <div id="resScore" class="mt-4 text-center font-bold text-xl hidden"></div>
            </div>
        </div>
    </main>

    <script>
        async function update() {
            try {
                const [aRes, tRes] = await Promise.all([fetch('/agents'), fetch('/trades')]);
                const agents = await aRes.json();
                const trades = await tRes.json();

                document.getElementById('agentsGrid').innerHTML = agents.map(a => `
                    <div class="agent-card rounded-3xl p-6" onclick="location.href='/agent_detail.html?name=${encodeURIComponent(a.name)}'">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h4 class="font-bold text-lg">${a.name}</h4>
                                <span class="text-[9px] bg-slate-800 px-2 py-1 rounded text-blue-400 font-mono uppercase">${a.symbol}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] text-slate-500 block">BAKİYE</span>
                                <span class="text-lg font-bold">$${a.balance.toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-[10px]">
                            <div class="bg-slate-950/40 p-2 rounded-lg">
                                <p class="text-slate-500">İŞLEMLER</p>
                                <p class="font-bold">${a.trade_count}</p>
                            </div>
                            <div class="bg-slate-950/40 p-2 rounded-lg">
                                <p class="text-slate-500">KALDIRAÇ</p>
                                <p class="font-bold text-yellow-500">${a.leverage}x</p>
                            </div>
                        </div>
                        ${a.active_position ? `
                            <div class="mt-4 p-3 bg-blue-500/10 border border-blue-500/20 rounded-xl flex justify-between items-center">
                                <span class="text-[10px] font-bold text-blue-400">AKTİF: ${a.active_position.side}</span>
                                <span class="text-[10px] text-slate-300 font-mono">${a.active_position.entry}</span>
                            </div>
                        ` : ''}
                    </div>
                `).join('');

                document.getElementById('tradeLogs').innerHTML = trades.map(t => `
                    <tr>
                        <td class="py-4 font-bold text-slate-300">${t.agent}</td>
                        <td class="py-4 text-slate-500 font-mono text-xs">${t.symbol}</td>
                        <td class="py-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.side === 'LONG' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'}">${t.side}</span></td>
                        <td class="py-4 font-bold ${t.profit_loss >= 0 ? 'text-emerald-500' : 'text-rose-500'}">${t.profit_loss >= 0 ? '+' : ''}${t.profit_loss}$</td>
                        <td class="py-4 text-right font-mono text-slate-400">$${t.balance_after}</td>
                    </tr>
                `).join('');

                const total = agents.reduce((s, a) => s + a.balance, 0);
                document.getElementById('totalCapital').innerText = `$${total.toLocaleString()}`;
                document.getElementById('activeCount').innerText = agents.length;
            } catch (e) {}
        }
        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
