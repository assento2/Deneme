<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Omni V4 - Dynamic Hunter Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --cyber-dark: #050505;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--cyber-dark);
            color: #fff;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(20, 20, 50, 0.4) 0%, transparent 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 2px, 3px 100%;
        }

        .header-title { font-family: 'Orbitron', sans-serif; }

        .fui-glass {
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .fui-glass::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            animation: scan-line 4s linear infinite;
        }

        @keyframes scan-line {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .neon-text { text-shadow: 0 0 10px var(--neon-blue); }
        .neon-border { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }

        .grid-bg {
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .hunter-card:hover {
            border-color: var(--neon-blue);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .matrix-pixel {
            width: 12px; height: 12px;
            border-radius: 2px;
            transition: all 0.5s;
        }

        .status-pulse {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--neon-blue); }
            50% { box-shadow: 0 0 20px var(--neon-blue); }
            100% { box-shadow: 0 0 5px var(--neon-blue); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); }
    </style>
</head>
<body class="p-4 md:p-8 grid-bg min-h-screen">

    <header class="max-w-[1600px] mx-auto mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center space-x-6">
            <div class="relative">
                <div class="w-20 h-20 bg-black rounded-full border-2 border-blue-500 flex items-center justify-center status-pulse">
                    <i class="fas fa-microchip text-4xl text-blue-400"></i>
                </div>
                <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-emerald-500 rounded-full border-2 border-black"></div>
            </div>
            <div>
                <h1 class="header-title text-5xl font-bold tracking-tighter italic neon-text">AEGIS OMNI <span class="text-blue-500">V4</span></h1>
                <p class="text-xs uppercase tracking-[0.5em] text-blue-400 font-bold">Autonomous Dynamic Hunter Network</p>
            </div>
        </div>

        <div class="flex items-center space-x-8">
            <div class="text-right">
                <p class="text-[10px] text-blue-300 uppercase">Global Liquidity Pool</p>
                <p class="text-3xl font-bold header-title" id="totalCapital">$0.00</p>
            </div>
            <button onclick="toggleLang()" class="p-4 border border-blue-500/30 rounded-lg hover:bg-blue-500/10 transition" id="langBtn">TR</button>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Left: Global Matrix Radar -->
        <div class="lg:col-span-3 space-y-8">
            <div class="fui-glass rounded-3xl p-6 border-l-4 border-blue-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="header-title text-sm font-bold flex items-center">
                        <i class="fas fa-satellite-dish mr-3 text-blue-400"></i> <span id="t-radar">MARKET RADAR</span>
                    </h2>
                    <span class="text-[10px] bg-blue-500/20 px-2 py-0.5 rounded text-blue-300 animate-pulse">SCANNING</span>
                </div>

                <div id="marketMatrix" class="grid grid-cols-5 gap-2 mb-6">
                    <!-- 50 pixels representing the market -->
                </div>

                <div id="oppList" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                    <p class="text-[10px] text-slate-500 italic">Initializing deep neural sweep...</p>
                </div>
            </div>

            <div class="fui-glass rounded-3xl p-6">
                <h2 class="header-title text-sm mb-4" id="t-system-logs">SYSTEM TELEMETRY</h2>
                <div id="telemetry" class="space-y-2 font-mono text-[9px] text-blue-300">
                    <div>> NETWORK_ESTABLISHED: OK</div>
                    <div>> NEURAL_ENGINE: ECO-OPTIMIZED</div>
                    <div>> MEMORY_THRESHOLD: SECURE</div>
                    <div>> HUNTER_POOL: 8/8 READY</div>
                </div>
            </div>
        </div>

        <!-- Center: Hunter Network -->
        <div class="lg:col-span-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="hunterGrid">
                <!-- Agents populated here -->
            </div>
        </div>

        <!-- Right: Execution Stream -->
        <div class="lg:col-span-3 space-y-8">
            <div class="fui-glass rounded-3xl p-6 border-r-4 border-purple-500">
                <h2 class="header-title text-sm font-bold mb-6 flex items-center">
                    <i class="fas fa-bolt mr-3 text-purple-400"></i> <span id="t-trades">EXECUTION STREAM</span>
                </h2>
                <div id="tradeStream" class="space-y-4 max-h-[700px] overflow-y-auto pr-2">
                    <!-- History here -->
                </div>
            </div>
        </div>

    </main>

    <script>
        let currentLang = 'en';
        const i18n = {
            tr: {
                radar: "PİYASA RADARI",
                systemLogs: "SİSTEM TELEMETRİSİ",
                trades: "İŞLEM AKIŞI",
                waiting: "BEKLİYOR...",
                hunting: "AVDA",
                active: "AKTİF İŞLEM",
                confidence: "GÜVEN",
                balance: "BAKİYE"
            },
            en: {
                radar: "MARKET RADAR",
                systemLogs: "SYSTEM TELEMETRY",
                trades: "EXECUTION STREAM",
                waiting: "WAITING...",
                hunting: "HUNTING",
                active: "ACTIVE TRADE",
                confidence: "CONFIDENCE",
                balance: "BALANCE"
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'tr' : 'en';
            document.getElementById('langBtn').innerText = currentLang === 'en' ? 'TR' : 'EN';
            document.getElementById('t-radar').innerText = i18n[currentLang].radar;
            document.getElementById('t-system-logs').innerText = i18n[currentLang].systemLogs;
            document.getElementById('t-trades').innerText = i18n[currentLang].trades;
            updateUI();
        }

        async function updateUI() {
            try {
                const [aRes, tRes, oRes] = await Promise.all([
                    fetch('/agents'), fetch('/trades'), fetch('/opportunities')
                ]);
                const agents = await aRes.json();
                const trades = await tRes.json();
                const opps = await oRes.json();
                const t = i18n[currentLang];

                // Update Matrix
                const matrix = document.getElementById('marketMatrix');
                matrix.innerHTML = '';
                for(let i=0; i<50; i++) {
                    let color = 'bg-slate-800';
                    if(opps[i]) {
                        color = opps[i].side === 'LONG' ? 'bg-emerald-500' : 'bg-rose-500';
                        if(opps[i].confidence > 85) color += ' status-pulse';
                    }
                    matrix.innerHTML += `<div class="matrix-pixel ${color} hover:scale-150 cursor-crosshair" title="${opps[i]?.symbol || ''}"></div>`;
                }

                // Update Opps
                document.getElementById('oppList').innerHTML = opps.slice(0, 15).map(o => `
                    <div class="p-3 rounded-xl bg-blue-500/5 border border-blue-500/10 flex justify-between items-center group hover:bg-blue-500/20 transition">
                        <div>
                            <p class="font-bold text-xs">${o.symbol}</p>
                            <div class="w-24 h-1 bg-slate-800 rounded-full mt-1 overflow-hidden">
                                <div class="h-full bg-blue-400" style="width: ${o.confidence}%"></div>
                            </div>
                        </div>
                        <span class="text-[10px] font-bold ${o.side === 'LONG' ? 'text-emerald-400' : 'text-rose-400'}">${o.side}</span>
                    </div>
                `).join('');

                // Update Grid
                document.getElementById('hunterGrid').innerHTML = agents.map(a => `
                    <a href="/agent_detail.html?name=${a.name}" class="fui-glass hunter-card rounded-2xl p-5 transition-all block border-l-2 ${a.active_position ? 'border-emerald-500' : 'border-blue-500/30'}">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="header-title text-xs font-bold text-blue-400">${a.name}</h3>
                                <p class="text-[10px] text-slate-400">${a.symbol}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] text-slate-500">${t.balance}</p>
                                <p class="text-sm font-bold">$${a.balance.toLocaleString()}</p>
                            </div>
                        </div>
                        ${a.active_position ? `
                            <div class="mt-4 p-2 bg-emerald-500/10 border border-emerald-500/20 rounded flex justify-between items-center">
                                <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest animate-pulse">${t.active}</span>
                                <span class="text-[10px] font-mono text-emerald-200">${a.active_position.side} @ ${a.active_position.entry.toFixed(4)}</span>
                            </div>
                        ` : `
                            <div class="mt-4 p-2 bg-blue-500/5 border border-blue-500/10 rounded text-center">
                                <span class="text-[9px] text-slate-600 uppercase tracking-widest">${t.waiting}</span>
                            </div>
                        `}
                    </a>
                `).join('');

                // Update Stream
                document.getElementById('tradeStream').innerHTML = trades.slice(0, 20).map(tr => `
                    <div class="p-4 rounded-2xl bg-black/40 border border-purple-500/10 hover:border-purple-500/40 transition">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-purple-300">${tr.agent}</span>
                            <span class="text-[9px] text-slate-500">${new Date(tr.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-xs font-bold">${tr.symbol}</span>
                            <span class="text-xs font-bold ${tr.net_profit_loss >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                                ${tr.net_profit_loss >= 0 ? '+' : ''}$${tr.net_profit_loss.toFixed(2)}
                            </span>
                        </div>
                        <div class="mt-1 text-[9px] text-slate-500 italic">"${tr.reasoning}"</div>
                    </div>
                `).join('');

                const total = agents.reduce((sum, a) => sum + a.balance, 0);
                document.getElementById('totalCapital').innerText = "$" + total.toLocaleString(undefined, {minimumFractionDigits: 2});

            } catch(e) { console.error(e); }
        }

        setInterval(updateUI, 5000);
        updateUI();
    </script>
</body>
</html>
