<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajan Detayı - CryptoSafe AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-6">
    <nav class="max-w-[1400px] mx-auto mb-10 flex justify-between items-center">
        <a href="/" class="flex items-center space-x-3 group">
            <div class="bg-slate-800 p-2 rounded-lg group-hover:bg-blue-600 transition">
                <i class="fas fa-arrow-left text-white"></i>
            </div>
            <span class="font-bold text-xl">Panel'e Dön</span>
        </a>
        <div id="agentBadge" class="px-4 py-2 rounded-full glass text-blue-400 font-mono text-sm uppercase"></div>
    </nav>

    <main class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Left: Charts & Reasonings -->
        <div class="lg:col-span-2 space-y-8">
            <div class="glass rounded-3xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold" id="agentNameDisplay">Ajan Analizi</h2>
                    <div class="flex space-x-2">
                        <span class="px-3 py-1 rounded-md bg-emerald-500/10 text-emerald-500 text-xs font-bold" id="agentStatus">AKTİF</span>
                    </div>
                </div>
                <div id="chartContainer" class="w-full h-[500px] rounded-2xl overflow-hidden"></div>
            </div>

            <div class="glass rounded-3xl p-8">
                <h3 class="text-xl font-bold mb-6">Son İşlem Yönergesi & Mantığı</h3>
                <div id="lastReasoning" class="p-6 bg-slate-950/50 rounded-2xl border border-slate-800 italic text-slate-300">
                    Henüz işlem açılmadı...
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6" id="indicatorGrid">
                    <!-- Indicators populated by JS -->
                </div>
            </div>
        </div>

        <!-- Right: Performance & History -->
        <div class="space-y-8">
            <div class="glass rounded-3xl p-8 bg-gradient-to-br from-blue-600/10 to-transparent">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-6">Performans Karnesi</h3>
                <div class="space-y-6">
                    <div>
                        <p class="text-slate-500 text-xs mb-1">Güncel Bakiye</p>
                        <p class="text-4xl font-bold" id="balanceDisplay">$0.00</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 rounded-2xl bg-slate-950/40">
                            <p class="text-slate-500 text-[10px] uppercase">Toplam İşlem</p>
                            <p class="text-xl font-bold" id="tradeCount">0</p>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-950/40">
                            <p class="text-slate-500 text-[10px] uppercase">Başarı Oranı</p>
                            <p class="text-xl font-bold text-emerald-400" id="winRate">0%</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass rounded-3xl p-8">
                <h3 class="text-lg font-bold mb-6">İşlem Geçmişi</h3>
                <div class="space-y-3 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar" id="tradeHistory">
                    <!-- Trades -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const agentName = params.get('name');
        let chart, candleSeries;

        function initChart() {
            const container = document.getElementById('chartContainer');
            chart = LightweightCharts.createChart(container, {
                layout: {
                    background: { type: 'solid', color: '#0f172a' },
                    textColor: '#94a3b8'
                },
                grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                rightPriceScale: { borderColor: '#334155' },
                timeScale: { borderColor: '#334155', timeVisible: true },
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444', borderVisible: false,
                wickUpColor: '#10b981', wickDownColor: '#ef4444'
            });

            new ResizeObserver(entries => {
                if (entries.length === 0 || !entries[0].contentRect) return;
                const { width, height } = entries[0].contentRect;
                chart.applyOptions({ width, height });
            }).observe(container);
        }

        async function updateData() {
            if (!agentName) return;
            try {
                const [agentsRes, tradesRes] = await Promise.all([
                    fetch('/agents'),
                    fetch(`/agent/${agentName}/trades`)
                ]);
                const agents = await agentsRes.json();
                const agent = agents.find(a => a.name === agentName);
                const trades = await tradesRes.json();

                if (agent) {
                    document.getElementById('agentBadge').innerText = agent.symbol;
                    document.getElementById('agentNameDisplay').innerText = agent.name;
                    document.getElementById('balanceDisplay').innerText = `$${agent.balance.toLocaleString()}`;
                    document.getElementById('tradeCount').innerText = agent.trade_count;
                    document.getElementById('agentStatus').innerText = agent.is_active ? 'AKTİF' : 'ELENDİ';

                    if (agent.last_trade) {
                        document.getElementById('lastReasoning').innerHTML = `
                            <p class="text-blue-400 font-bold mb-2">İşlem Yönergesi:</p>
                            "${agent.last_trade.reasoning}"
                            <p class="text-[10px] text-slate-500 mt-4 font-mono">Giriş Fiyatı: ${agent.last_trade.entry_price}</p>
                        `;

                        const indHtml = Object.entries(agent.last_trade.indicators).map(([k, v]) => `
                            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                                <p class="text-[10px] text-slate-500 uppercase">${k}</p>
                                <p class="text-sm font-bold text-slate-300">${v}</p>
                            </div>
                        `).join('');
                        document.getElementById('indicatorGrid').innerHTML = indHtml;
                    }

                    // Calculate win rate
                    const wins = trades.filter(t => t.success).length;
                    const wr = trades.length > 0 ? (wins / trades.length * 100).toFixed(1) : 0;
                    document.getElementById('winRate').innerText = `${wr}%`;

                    // Update History
                    document.getElementById('tradeHistory').innerHTML = trades.map(t => `
                        <div class="p-4 rounded-2xl bg-slate-950/30 border border-slate-800/50 flex justify-between items-center">
                            <div>
                                <p class="text-xs font-bold ${t.success ? 'text-emerald-500' : 'text-red-500'}">${t.symbol}</p>
                                <p class="text-[10px] text-slate-500">${new Date(t.timestamp).toLocaleTimeString()}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold text-sm">${t.profit_loss > 0 ? '+' : ''}${t.profit_loss}</p>
                                <p class="text-[10px] text-slate-600">$${t.balance_after}</p>
                            </div>
                        </div>
                    `).join('');

                    // Update Chart with real MEXC data
                    const klineRes = await fetch(`/kline?symbol=${agent.symbol}`);
                    const klineData = await klineRes.json();
                    if (klineData) {
                        const formatted = klineData.map(d => ({
                            time: d.time, open: d.open, high: d.high, low: d.low, close: d.close
                        }));
                        candleSeries.setData(formatted);
                    }
                }
            } catch (err) { console.error(err); }
        }

        initChart();
        updateData();
        setInterval(updateData, 10000);
    </script>
</body>
</html>
