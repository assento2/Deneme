<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Analysis - CryptoSafe AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; padding: 24px; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="max-w-[1400px] mx-auto mb-10 flex justify-between items-center">
        <a href="/" class="flex items-center space-x-3 group">
            <div class="bg-slate-800 p-2 rounded-lg group-hover:bg-blue-600 transition">
                <i class="fas fa-arrow-left text-white"></i>
            </div>
            <span class="font-bold text-xl" id="t-back">Back to Panel</span>
        </a>
        <div id="agentBadge" class="px-4 py-2 rounded-full glass text-blue-400 font-mono text-sm uppercase tracking-tighter">LOADING...</div>
    </nav>

    <main class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-8">
            <div class="glass rounded-3xl p-6 relative">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold" id="agentNameDisplay">Agent Analysis</h2>
                    <div class="flex space-x-2">
                        <span id="posBadge" class="hidden px-3 py-1 rounded-md bg-blue-500/10 text-blue-500 text-xs font-bold uppercase tracking-widest">TRADING</span>
                        <span class="px-3 py-1 rounded-md bg-emerald-500/10 text-emerald-500 text-xs font-bold" id="t-active">ACTIVE</span>
                    </div>
                </div>
                <div id="chartContainer" style="width: 100%; height: 500px;" class="rounded-2xl overflow-hidden bg-slate-950"></div>
            </div>

            <div class="glass rounded-3xl p-8">
                <h3 class="text-xl font-bold mb-6" id="t-active-title">Active Position / Last Strategy</h3>
                <div id="activePosCard" class="p-6 bg-slate-950/50 rounded-2xl border border-slate-800 hidden mb-6">
                    <div class="grid grid-cols-4 gap-4 text-center">
                        <div><p class="text-[10px] text-slate-500 uppercase" id="t-entry">ENTRY</p><p id="posEntry" class="font-bold">--</p></div>
                        <div><p class="text-[10px] text-slate-500 uppercase" id="t-side">SIDE</p><p id="posSide" class="font-bold text-blue-400">--</p></div>
                        <div><p class="text-[10px] text-slate-500 uppercase" id="t-lev">LEVERAGE</p><p id="posLev" class="font-bold text-yellow-500">10x</p></div>
                        <div><p class="text-[10px] text-slate-500 uppercase">TP</p><p id="posTP" class="font-bold text-emerald-400">--</p></div>
                    </div>
                </div>
                <div id="lastReasoning" class="p-6 bg-slate-950/50 rounded-2xl border border-slate-800 italic text-slate-300">Strategy analysis in progress...</div>
            </div>
        </div>

        <div class="space-y-8">
            <div class="glass rounded-3xl p-8 bg-gradient-to-br from-blue-600/10 to-transparent">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-6" id="t-perf">Performance Scorecard</h3>
                <div class="space-y-6">
                    <div>
                        <p class="text-slate-500 text-xs mb-1" id="t-bal">Current Balance</p>
                        <p class="text-4xl font-bold" id="balanceDisplay">$1,000.00</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 rounded-2xl bg-slate-950/40 border border-slate-800">
                            <p class="text-slate-500 text-[10px] uppercase" id="t-total-trades">TOTAL TRADES</p>
                            <p class="text-xl font-bold" id="tradeCount">0</p>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-950/40 border border-slate-800">
                            <p class="text-slate-500 text-[10px] uppercase" id="t-win-rate">WIN RATE</p>
                            <p class="text-xl font-bold text-emerald-400" id="winRate">0%</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="glass rounded-3xl p-8">
                <h3 class="text-lg font-bold mb-6" id="t-history">Transaction History (Incl. Fees)</h3>
                <div class="space-y-3 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar min-h-[100px]" id="tradeHistory"></div>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const agentName = params.get('name') || "Titan-AI";
        let chart, candleSeries;

        function initChart() {
            const container = document.getElementById('chartContainer');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 500,
                layout: { background: { type: LightweightCharts.ColorType.Solid, color: '#0f172a' }, textColor: '#94a3b8' },
                grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                timeScale: { timeVisible: true, secondsVisible: true }
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444', borderVisible: false,
                wickUpColor: '#10b981', wickDownColor: '#ef4444'
            });
            window.addEventListener('resize', () => { chart.applyOptions({ width: container.clientWidth }); });
        }

        async function updateData() {
            try {
                const [aRes, tRes] = await Promise.all([
                    fetch('/agents'),
                    fetch('/agent/' + encodeURIComponent(agentName) + '/trades')
                ]);
                const agents = await aRes.json();
                const trades = await tRes.json();
                const agent = agents.find(a => a.name.toLowerCase() === agentName.toLowerCase());

                if (agent) {
                    document.getElementById('agentBadge').innerText = agent.symbol + " | REEL ANALİZ";
                    document.getElementById('agentNameDisplay').innerText = agent.name;
                    document.getElementById('balanceDisplay').innerText = "$" + agent.balance.toLocaleString(undefined, {minimumFractionDigits: 2});
                    document.getElementById('tradeCount').innerText = agent.trade_count;

                    if (agent.active_position) {
                        document.getElementById('posBadge').classList.remove('hidden');
                        document.getElementById('activePosCard').classList.remove('hidden');
                        document.getElementById('posEntry').innerText = agent.active_position.entry.toFixed(6);
                        document.getElementById('posSide').innerText = agent.active_position.side;
                        document.getElementById('posLev').innerText = agent.active_position.leverage + "x";
                        document.getElementById('posTP').innerText = agent.active_position.tp.toFixed(6);
                    } else {
                        document.getElementById('posBadge').classList.add('hidden');
                        document.getElementById('activePosCard').classList.add('hidden');
                    }

                    if (agent.last_trade) {
                        document.getElementById('lastReasoning').innerText = `Last Trade Result: ${agent.last_trade.reasoning}`;
                    }

                    const wins = trades.filter(t => t.success).length;
                    document.getElementById('winRate').innerText = (trades.length > 0 ? (wins/trades.length*100).toFixed(1) : 0) + "%";

                    document.getElementById('tradeHistory').innerHTML = trades.map(t => `
                        <div class="p-4 rounded-xl bg-slate-950/40 border border-slate-800/50 text-xs space-y-2">
                            <div class="flex justify-between font-bold">
                                <span class="${t.side === 'LONG' ? 'text-emerald-400' : 'text-rose-400'}">${t.side} | ${t.symbol}</span>
                                <span class="${t.success ? 'text-emerald-500' : 'text-rose-500'}">${t.profit_pct >= 0 ? '+' : ''}${t.profit_pct.toFixed(2)}%</span>
                            </div>
                            <div class="grid grid-cols-2 text-slate-500">
                                <span>In: ${t.entry_price.toFixed(6)}</span>
                                <span class="text-right">Out: ${t.exit_price.toFixed(6)}</span>
                            </div>
                            <div class="flex justify-between items-center pt-1 border-t border-slate-800/50">
                                <span class="text-[10px] text-slate-600">Fee: $${t.fees.toFixed(2)}</span>
                                <span class="font-bold ${t.success ? 'text-emerald-400' : 'text-rose-400'}">Net: $${t.net_profit_loss.toFixed(2)}</span>
                            </div>
                        </div>
                    `).join('');

                    const kRes = await fetch('/kline?symbol=' + agent.symbol);
                    if (kRes.ok) {
                        const kData = await kRes.json();
                        // MEXC Contract API returns time in seconds, no division needed
                        candleSeries.setData(kData.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));
                    }
                }
            } catch (e) { console.error(e); }
        }

        window.onload = () => { initChart(); updateData(); setInterval(updateData, 10000); };
    </script>
</body>
</html>
